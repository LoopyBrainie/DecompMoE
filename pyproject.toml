[project]
name = "decompmoe"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "torch==2.12.1",
    "torchvision==0.27.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
# Make `decompmoe` importable without an editable install.
pythonpath = ["src"]
testpaths = ["tests"]